<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You're offline | Nanogram Jams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f2ef;--panel:#fff;--ink:#171717;--mute:#666;--line:rgba(0,0,0,.12);--d:"Inter Tight","Helvetica Neue",Arial,sans-serif;--b:"Inter","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--panel:#1a1a1a;--ink:#f5f5f5;--mute:#9a9a9a;--line:rgba(255,255,255,.14)}}
:root[data-theme=dark]{--bg:#0e0e0e;--panel:#1a1a1a;--ink:#f5f5f5;--mute:#9a9a9a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--b);padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{text-align:center;max-width:640px;width:100%}
.tile{position:relative;width:168px;height:168px;margin:0 auto 26px;border-radius:44px;background:linear-gradient(135deg,#e6e0ff,#f7d6ee);display:grid;place-items:center;box-shadow:0 18px 50px rgba(80,50,160,.22);overflow:hidden}
.tile:after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.14) 1px,transparent 1.5px) 0 0/16px 16px;opacity:.7}
.tile svg{position:relative;z-index:1}
.eyebrow{font:600 12px var(--b);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.big{font:800 clamp(60px,18vw,112px)/.9 var(--d);letter-spacing:-.065em;margin:0 0 10px}
.sub{font:700 clamp(34px,10.5vw,64px)/1 var(--d);letter-spacing:-.05em;margin:0 0 16px}
p.msg{color:var(--mute);margin:0 auto 28px;max-width:38ch}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--line);font:600 15px var(--d);letter-spacing:-.01em;cursor:pointer;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--panel);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.credit{margin-top:34px;font-size:13px;color:var(--mute)}.credit b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <div class="tile"><svg viewBox="0 0 110 80" width="96" height="70" fill="#2b2160" aria-hidden="true"><rect x="20" y="0" width="10" height="10"/><rect x="80" y="0" width="10" height="10"/><rect x="30" y="10" width="10" height="10"/><rect x="70" y="10" width="10" height="10"/><rect x="20" y="20" width="10" height="10"/><rect x="30" y="20" width="10" height="10"/><rect x="40" y="20" width="10" height="10"/><rect x="50" y="20" width="10" height="10"/><rect x="60" y="20" width="10" height="10"/><rect x="70" y="20" width="10" height="10"/><rect x="80" y="20" width="10" height="10"/><rect x="10" y="30" width="10" height="10"/><rect x="20" y="30" width="10" height="10"/><rect x="40" y="30" width="10" height="10"/><rect x="50" y="30" width="10" height="10"/><rect x="60" y="30" width="10" height="10"/><rect x="80" y="30" width="10" height="10"/><rect x="90" y="30" width="10" height="10"/><rect x="0" y="40" width="10" height="10"/><rect x="10" y="40" width="10" height="10"/><rect x="20" y="40" width="10" height="10"/><rect x="30" y="40" width="10" height="10"/><rect x="40" y="40" width="10" height="10"/><rect x="50" y="40" width="10" height="10"/><rect x="60" y="40" width="10" height="10"/><rect x="70" y="40" width="10" height="10"/><rect x="80" y="40" width="10" height="10"/><rect x="90" y="40" width="10" height="10"/><rect x="100" y="40" width="10" height="10"/><rect x="0" y="50" width="10" height="10"/><rect x="20" y="50" width="10" height="10"/><rect x="30" y="50" width="10" height="10"/><rect x="40" y="50" width="10" height="10"/><rect x="50" y="50" width="10" height="10"/><rect x="60" y="50" width="10" height="10"/><rect x="70" y="50" width="10" height="10"/><rect x="80" y="50" width="10" height="10"/><rect x="100" y="50" width="10" height="10"/><rect x="0" y="60" width="10" height="10"/><rect x="20" y="60" width="10" height="10"/><rect x="80" y="60" width="10" height="10"/><rect x="100" y="60" width="10" height="10"/><rect x="30" y="70" width="10" height="10"/><rect x="40" y="70" width="10" height="10"/><rect x="60" y="70" width="10" height="10"/><rect x="70" y="70" width="10" height="10"/><rect x="20" y="30" width="10" height="10" fill="#f1ecff"/><rect x="80" y="30" width="10" height="10" fill="#f1ecff"/></svg></div>
  <h1 class="big">Offline</h1>
  <h2 class="sub">Can&#39;t reach the server</h2>
  <p class="msg">Check your internet connection. This page reloads by itself as soon as you're back online.</p>
  <div class="row"><button class="btn dark" type="button" onclick="location.reload()">Try again</button><a class="btn" id="home" href="/">Go to home</a></div>
  <p class="credit">Built by <b>Yannirix Studios</b></p>
</main>
<script>
(function(){
  var t=null;try{t=localStorage.getItem("nanogram-theme")}catch(e){}
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
  /* works from any depth, including a GitHub Pages project site (/repo-name/) */
  var p=location.pathname.split("/").filter(Boolean),base=/github\.io$/.test(location.hostname)&&p.length?"/"+p[0]+"/":"/";
  var h=document.getElementById("home");if(h)h.setAttribute("href",base);
  window.addEventListener("online",function(){location.reload()});
})();
</script>
</body>
</html>
